   Tabular RL from scratch. Gridworld. Deep Lab preview. All computation local.

const CHAPTERS=[
 {id:"foundations",title:"1. Foundations",desc:"The MDP, returns and discounting, value functions, Bellman equations.",ids:["mdp","returns","values","bellman"]},
 {id:"dp",title:"2. Dynamic programming",desc:"Policy evaluation, policy iteration, value iteration, and GPI.",ids:["dp"]},

];

/* ------------------------------ utilities --------------------------------- */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ============================================================================
   GRIDWORLD ENGINE
   A small tabular MDP. States are cells. Actions are up/right/down/left.
   Rewards: step = -stepReward, goal = +goalReward, cliff = -cliffReward and reset.
   ========================================================================== */
const GridWorld = (function(){
 const ROWS=5, COLS=5;
 const ACTIONS=[0,1,2,3]; // 0=up, 1=right, 2=down, 3=left
 const DR=[-1,0,1,0], DC=[0,1,0,-1];
 const ARROW=['↑','→','↓','←'];

 function make(opts){
  opts=opts||{};
  const gw={
   rows:ROWS,cols:COLS,
   walls:new Set(),
   cliff:new Set(),
   goal:{r:ROWS-1,c:COLS-1},
   start:{r:0,c:0},
   stepReward:opts.stepReward!==undefined?opts.stepReward:1,
   goalReward:opts.goalReward!==undefined?opts.goalReward:10,
   cliffReward:opts.cliffReward!==undefined?opts.cliffReward:100,
   slip:opts.slip!==undefined?opts.slip:0,
   gamma:opts.gamma!==undefined?opts.gamma:0.95,
  };
  return gw;
 }

 function idx(gw,r,c){return r*gw.cols+c}
 function inBounds(gw,r,c){return r>=0&&r<gw.rows&&c>=0&&c<gw.cols}
 function isWall(gw,r,c){return gw.walls.has(r+','+c)}
 function isCliff(gw,r,c){return gw.cliff.has(r+','+c)}
 function isGoal(gw,r,c){return gw.goal.r===r&&gw.goal.c===c}
 function isTerminal(gw,r,c){return isGoal(gw,r,c)}

 /** Deterministic or slippery transition. Returns {r,c,reward,terminal}. */
 function step(gw,r,c,a,rng){
  let dr=DR[a], dc=DC[a];
  if(gw.slip>0&&rng){
   if(rng()<gw.slip){
    // perpendicular slip
    const perp=(rng()<0.5)?1:3;
    dr=DR[perp]; dc=DC[perp];
   }
  }
  let nr=r+dr, nc=c+dc;
  if(!inBounds(gw,nr,nc)||isWall(gw,nr,nc)){nr=r;nc=c}
  if(isCliff(gw,nr,nc)){
   return {r:gw.start.r, c:gw.start.c, reward:-gw.cliffReward, terminal:false, fell:true};
  }
  if(isGoal(gw,nr,nc)){
   return {r:nr, c:nc, reward:gw.goalReward, terminal:true};
  }
  return {r:nr, c:nc, reward:-gw.stepReward, terminal:false};
 }

 /** Enumerate all non-wall, non-terminal states. */
 function states(gw){
  const out=[];
  for(let r=0;r<gw.rows;r++)for(let c=0;c<gw.cols;c++){
   if(isWall(gw,r,c))continue;
   out.push([r,c]);
  }
  return out;
 }

 /** Policy evaluation: V(s) <- sum_a pi(a|s) [r + gamma V(s')]. */
 function policyEvaluation(gw,policy,opts){
  opts=opts||{};
  const theta=opts.theta||1e-8, maxIter=opts.maxIter||10000;
  const V=new Float64Array(gw.rows*gw.cols);
  const rng=opts.rng;
  let iters=0;
  for(let it=0;it<maxIter;it++){
   let delta=0;
   iters=it+1;
   for(const [r,c] of states(gw)){
    if(isTerminal(gw,r,c)){V[idx(gw,r,c)]=0;continue}
    let v=0;
    const pi=policy[r*gw.cols+c]||[0.25,0.25,0.25,0.25];
    // For deterministic transitions this is a simple sum.
    // For slippered transitions we compute the expected value across
    // the effective action distribution (pi mixed with slip).
    for(const a of ACTIONS){
     const p=pi[a];
     if(p===0)continue;
     const possible=possibleTransitions(gw,r,c,a);
     for(const t of possible){
      v+=p*t.prob*(t.reward+gw.gamma*V[idx(gw,t.r,t.c)]);
     }
    }
    delta=Math.max(delta,Math.abs(v-V[idx(gw,r,c)]));
    V[idx(gw,r,c)]=v;
   }
   if(delta<theta)break;
  }
  return {V,iters};
 }

 /** Enumerate possible next (r,c,reward,prob) for a state-action under the slip model. */
 function possibleTransitions(gw,r,c,a){
  const out=[];
  if(gw.slip<=0){
   const dr=DR[a], dc=DC[a];
   let nr=r+dr, nc=c+dc;
   if(!inBounds(gw,nr,nc)||isWall(gw,nr,nc)){nr=r;nc=c}
   if(isCliff(gw,nr,nc)){
    out.push({r:gw.start.r,c:gw.start.c,reward:-gw.cliffReward,prob:1});
   } else if(isGoal(gw,nr,nc)){
    out.push({r:nr,c:nc,reward:gw.goalReward,prob:1});
   } else {
    out.push({r:nr,c:nc,reward:-gw.stepReward,prob:1});
   }
   return out;
  }
  // slip: main with prob 1-slip, each perpendicular with slip/2
  const main={a, p:1-gw.slip};
  const perps=[(a+1)%4, (a+3)%4];
  const list=[main, {a:perps[0], p:gw.slip/2}, {a:perps[1], p:gw.slip/2}];
  for(const t of list){
   const dr=DR[t.a], dc=DC[t.a];
   let nr=r+dr, nc=c+dc;
   if(!inBounds(gw,nr,nc)||isWall(gw,nr,nc)){nr=r;nc=c}
   if(isCliff(gw,nr,nc)){
    out.push({r:gw.start.r,c:gw.start.c,reward:-gw.cliffReward,prob:t.p});
   } else if(isGoal(gw,nr,nc)){
    out.push({r:nr,c:nc,reward:gw.goalReward,prob:t.p});
   } else {
    out.push({r:nr,c:nc,reward:-gw.stepReward,prob:t.p});
   }
  }
  return out;
 }

 /** One sweep of policy improvement. Returns a new deterministic greedy policy. */
 function policyImprovement(gw,V){
  const policy={};
  for(const [r,c] of states(gw)){
   if(isTerminal(gw,r,c)){policy[r*gw.cols+c]=[0,0,0,0];continue}
   const q=[0,0,0,0];
   for(const a of ACTIONS){
    const possible=possibleTransitions(gw,r,c,a);
    let qa=0;
    for(const t of possible)qa+=t.prob*(t.reward+gw.gamma*V[idx(gw,t.r,t.c)]);
    q[a]=qa;
   }
   // greedy argmax with random tie-break
   let best=-Infinity, bestActions=[];
   for(const a of ACTIONS){if(q[a]>best+1e-12){best=q[a];bestActions=[a]}else if(Math.abs(q[a]-best)<1e-12)bestActions.push(a)}
   const choice=bestActions[Math.floor(bestActions.length/2)];
   const p=[0,0,0,0];p[choice]=1;
   policy[r*gw.cols+c]=p;
  }
  return policy;
 }

 /** Policy iteration: evaluate, improve, repeat. */
 function policyIteration(gw,opts){
  opts=opts||{};
  const maxOuter=opts.maxOuter||100;
  const theta=opts.theta||1e-8;
  // start with uniform random policy
  let policy={};
  for(const [r,c] of states(gw)){
   if(isTerminal(gw,r,c)){policy[r*gw.cols+c]=[0,0,0,0];continue}
   policy[r*gw.cols+c]=[0.25,0.25,0.25,0.25];
  }
  let V=null, outer=0, evalIters=0;
  for(let o=0;o<maxOuter;o++){
   outer=o+1;
   const ev=policyEvaluation(gw,policy,{theta});
   V=ev.V;
   evalIters=ev.iters;
   const newPolicy=policyImprovement(gw,V);
   let stable=true;
   for(const key in newPolicy){
    const a=newPolicy[key], b=policy[key];
    for(let i=0;i<4;i++)if(Math.abs(a[i]-b[i])>1e-9){stable=false;break}
    if(!stable)break;
   }
   policy=newPolicy;
   if(stable)break;
  }
  return {V,policy,outer,evalIters};
 }

 /** Value iteration: V(s) <- max_a sum p [r + gamma V(s')]. */
 function valueIteration(gw,opts){
  opts=opts||{};
  const theta=opts.theta||1e-8, maxIter=opts.maxIter||10000;
  const V=new Float64Array(gw.rows*gw.cols);
  let iters=0;
  for(let it=0;it<maxIter;it++){
   let delta=0;
   iters=it+1;
   for(const [r,c] of states(gw)){
    if(isTerminal(gw,r,c)){V[idx(gw,r,c)]=0;continue}
    let best=-Infinity;
    for(const a of ACTIONS){
     const possible=possibleTransitions(gw,r,c,a);
     let q=0;
     for(const t of possible)q+=t.prob*(t.reward+gw.gamma*V[idx(gw,t.r,t.c)]);
     if(q>best)best=q;
    }
    delta=Math.max(delta,Math.abs(best-V[idx(gw,r,c)]));
    V[idx(gw,r,c)]=best;
   }
   if(delta<theta)break;
  }
  const policy=policyImprovement(gw,V);
  return {V,policy,iters};
 }

 /** Q-table helpers. */
 function emptyQ(gw){
  const Q={};
  for(let r=0;r<gw.rows;r++)for(let c=0;c<gw.cols;c++){
   if(isWall(gw,r,c))continue;
   Q[r*gw.cols+c]=new Float64Array(4);
  }
  return Q;
 }
 function randomState(gw,rng){
  for(let i=0;i<500;i++){
   const r=Math.floor(rng()*gw.rows), c=Math.floor(rng()*gw.cols);
   if(!isWall(gw,r,c)&&!isTerminal(gw,r,c))return {r,c};
  }
  return {r:gw.start.r,c:gw.start.c};
 }
 function greedy(Q,gw,r,c){
  const q=Q[r*gw.cols+c];
  let best=-Infinity, bestActions=[];
  for(const a of ACTIONS){if(q[a]>best+1e-12){best=q[a];bestActions=[a]}else if(Math.abs(q[a]-best)<1e-12)bestActions.push(a)}
  return bestActions[0];
 }
 function epsGreedy(Q,gw,r,c,epsilon,rng){
  if(rng()<epsilon)return Math.floor(rng()*4);
  return greedy(Q,gw,r,c);
 }

 /** Run one episode of Q-learning or SARSA. Returns {reward, steps, qChanged}. */
 function runEpisode(gw,Q,algo,opts){
  const rng=opts.rng;
  const epsilon=opts.epsilon, alpha=opts.alpha;
  const maxSteps=opts.maxSteps||200;
  let s=randomState(gw,rng);
  let a=epsGreedy(Q,gw,s.r,s.c,epsilon,rng);
  let totalReward=0, steps=0, qChanged=0;
  for(let t=0;t<maxSteps;t++){
   const tr=step(gw,s.r,s.c,a,rng);
   totalReward+=tr.reward;
   steps++;
   const sIdx=s.r*gw.cols+s.c;
   if(algo==='qlearning'){
    let maxNext=0;
    if(!tr.terminal){
     const qn=Q[tr.r*gw.cols+tr.c];
     maxNext=Math.max(qn[0],qn[1],qn[2],qn[3]);
    }
    const target=tr.reward+gw.gamma*(tr.terminal?0:maxNext);
    const td=target-Q[sIdx][a];
    Q[sIdx][a]+=alpha*td;
    qChanged+=Math.abs(td);
    s={r:tr.r,c:tr.c};
    if(tr.terminal)break;
    a=epsGreedy(Q,gw,s.r,s.c,epsilon,rng);
   } else { // SARSA
    let nextQ=0;
    let nextA=0;
    if(!tr.terminal){
     nextA=epsGreedy(Q,gw,tr.r,tr.c,epsilon,rng);
     nextQ=Q[tr.r*gw.cols+tr.c][nextA];
    }
    const target=tr.reward+gw.gamma*(tr.terminal?0:nextQ);
    const td=target-Q[sIdx][a];
    Q[sIdx][a]+=alpha*td;
    qChanged+=Math.abs(td);
    s={r:tr.r,c:tr.c};
    if(tr.terminal)break;
    a=nextA;
   }
  }
  return {reward:totalReward, steps, qChanged};
 }

 /** Greedy evaluation: how much reward does the greedy policy collect? */
 function greedyEval(gw,Q,maxSteps){
  maxSteps=maxSteps||200;
  let s={r:gw.start.r,c:gw.start.c};
  let total=0, steps=0;
  for(let t=0;t<maxSteps;t++){
   if(isTerminal(gw,s.r,s.c))break;
   const a=greedy(Q,gw,s.r,s.c);
   const tr=step(gw,s.r,s.c,a,null); // deterministic, no slip
   total+=tr.reward;
   steps++;
   s={r:tr.r,c:tr.c};
   if(tr.terminal)break;
  }
  return {reward:total, steps};
 }

 return {ROWS,COLS,ACTIONS,ARROW,make,idx,inBounds,isWall,isCliff,isGoal,isTerminal,step,states,policyEvaluation,policyImprovement,policyIteration,valueIteration,emptyQ,randomState,epsGreedy,greedy,runEpisode,greedyEval,possibleTransitions};
})();

"mctd":{python:`import numpy as np

# Toy environment: 5 states in a line, deterministic, terminal on the right
N_STATES = 5
TERMINAL = N_STATES - 1
GAMMA = 0.9

def step(s, a):
    """a = 0 (left), 1 (right). Rewards only on the terminal arrival."""
    ns = max(0, min(N_STATES - 1, s + (1 if a == 1 else -1)))
    reward = 1.0 if ns == TERMINAL and s != TERMINAL else 0.0
    done = (ns == TERMINAL)
    return ns, reward, done

# Monte Carlo prediction
def mc_prediction(episodes=2000, alpha=0.05, seed=0):
    rng = np.random.default_rng(seed)
    V = np.zeros(N_STATES)
    for _ in range(episodes):
        # generate an episode with a random policy
        s = 0
        trajectory = []
        for _ in range(50):
            a = rng.integers(0, 2)
            ns, r, done = step(s, a)
            trajectory.append((s, r))
            s = ns
            if done:
                break
        # every-visit MC: update V toward the actual return
        G = 0.0
        for s, r in reversed(trajectory):
            G = r + GAMMA * G
            V[s] += alpha * (G - V[s])
    return V

# TD(0) prediction
def td0_prediction(episodes=2000, alpha=0.05, seed=0):
    rng = np.random.default_rng(seed)
    V = np.zeros(N_STATES)
    for _ in range(episodes):
        s = 0
        for _ in range(50):
            a = rng.integers(0, 2)
            ns, r, done = step(s, a)
            target = r + GAMMA * (0.0 if done else V[ns])
            V[s] += alpha * (target - V[s])
            s = ns
            if done:
                break
    return V

print("MC   V:", np.round(mc_prediction(), 3))
print("TD(0)V:", np.round(td0_prediction(), 3))
`},
"sarsaq":{python:`import numpy as np

# 4x4 gridworld, goal at (3,3), step reward -1, goal reward 0
ROWS, COLS = 4, 4
GAMMA = 0.95
ALPHA = 0.1
EPSILON = 0.1

def is_terminal(r, c): return (r, c) == (3, 3)
def step(r, c, a):
    dr, dc = [(-1,0),(0,1),(1,0),(0,-1)][a]
    nr, nc = r + dr, c + dc
    if not (0 <= nr < ROWS and 0 <= nc < COLS):
        nr, nc = r, c
    if is_terminal(nr, nc):
        return nr, nc, 0.0, True
    return nr, nc, -1.0, False

def eps_greedy(Q, r, c, eps, rng):
    if rng.random() < eps:
        return rng.integers(0, 4)
    return int(np.argmax(Q[r, c]))

def run_episode(Q, algo, seed=0):
    rng = np.random.default_rng(seed)
    r, c = 0, 0
    a = eps_greedy(Q, r, c, EPSILON, rng)
    total = 0.0
    for _ in range(200):
        nr, nc, reward, done = step(r, c, a)
        total += reward
        if algo == "qlearning":
            target = reward + (0 if done else GAMMA * np.max(Q[nr, nc]))
        else:
            na = eps_greedy(Q, nr, nc, EPSILON, rng)
            target = reward + (0 if done else GAMMA * Q[nr, nc, na])
        Q[r, c, a] += ALPHA * (target - Q[r, c, a])
        r, c = nr, nc
        if done:
            break
        a = eps_greedy(Q, r, c, EPSILON, rng) if algo == "qlearning" else na
    return total

for algo in ["qlearning", "sarsa"]:
    Q = np.zeros((ROWS, COLS, 4))
    for ep in range(2000):
        run_episode(Q, algo, seed=ep)
    # greedy evaluation
    r, c = 0, 0
    total = 0.0
    for _ in range(50):
        if is_terminal(r, c):
            break
        a = int(np.argmax(Q[r, c]))
        r, c, reward, done = step(r, c, a)
        total += reward
        if done:
            break
    print(f"{algo:>10}: greedy return = {total:.2f}")
`},
"explore":{python:`import numpy as np

# 5-armed bandit, each arm has a different mean reward
TRUE_MEANS = np.array([0.3, 0.1, 0.5, 0.4, 0.2])

def pull(a, rng):
    return rng.normal(TRUE_MEANS[a], 0.1)

# ε-greedy
def eps_greedy(mean, count, epsilon, rng):
    if rng.random() < epsilon:
        return rng.integers(0, len(mean))
    return int(np.argmax(mean))

# UCB1
def ucb1(mean, count, t, c=1.0):
    if np.any(count == 0):
        return int(np.argmin(count))   # try each arm at least once
    bonus = c * np.sqrt(np.log(t + 1) / count)
    return int(np.argmax(mean + bonus))

def run(strategy, steps=2000, seed=0):
    rng = np.random.default_rng(seed)
    mean = np.zeros(5)
    count = np.zeros(5)
    total_reward = 0.0
    for t in range(steps):
        if strategy == "eps":
            a = eps_greedy(mean, count, 0.1, rng)
        else:
            a = ucb1(mean, count, t)
        r = pull(a, rng)
        total_reward += r
        count[a] += 1
        mean[a] += (r - mean[a]) / count[a]
    return total_reward / steps

print("ε-greedy mean reward:", run("eps"))
print("UCB1     mean reward:", run("ucb"))
print("optimal arm mean   :", TRUE_MEANS.max())
`},
"fa":{python:`# A minimal DQN skeleton. Not runnable without an environment,
# but the structure is exactly what you would write.

import numpy as np
import torch
import torch.nn as nn

class QNetwork(nn.Module):
    def __init__(self, obs_dim, n_actions, hidden=64):
        super().__init__()
        self.net = nn.Sequential(
            nn.Linear(obs_dim, hidden), nn.ReLU(),
            nn.Linear(hidden, hidden), nn.ReLU(),
            nn.Linear(hidden, n_actions),
        )
    def forward(self, x):
        return self.net(x)

class ReplayBuffer:
    def __init__(self, capacity=100_000):
        self.buffer = []
        self.capacity = capacity
    def push(self, s, a, r, s_next, done):
        self.buffer.append((s, a, r, s_next, done))
        if len(self.buffer) > self.capacity:
            self.buffer.pop(0)
    def sample(self, batch_size):
        idx = np.random.choice(len(self.buffer), batch_size, replace=False)
        return [self.buffer[i] for i in idx]
    def __len__(self):
        return len(self.buffer)

# Training loop skeleton
q_online = QNetwork(4, 2)
q_target = QNetwork(4, 2)
q_target.load_state_dict(q_online.state_dict())
optimizer = torch.optim.Adam(q_online.parameters(), lr=1e-3)
buffer = ReplayBuffer()
gamma = 0.99

for step in range(100_000):
    # s, a, r, s_next, done = env.step(...)
    # buffer.push(s, a, r, s_next, done)
    if len(buffer) < 1000:
        continue
    batch = buffer.sample(64)
    s = torch.tensor([b[0] for b in batch], dtype=torch.float32)
    a = torch.tensor([b[1] for b in batch], dtype=torch.long)
    r = torch.tensor([b[2] for b in batch], dtype=torch.float32)
    s_next = torch.tensor([b[3] for b in batch], dtype=torch.float32)
    done = torch.tensor([b[4] for b in batch], dtype=torch.float32)

    with torch.no_grad():
        q_next = q_target(s_next).max(dim=1).values
        target = r + gamma * (1 - done) * q_next
    q = q_online(s).gather(1, a.unsqueeze(1)).squeeze(1)
    loss = ((q - target) ** 2).mean()
    optimizer.zero_grad()
    loss.backward()
    optimizer.step()

    if step % 1000 == 0:
        q_target.load_state_dict(q_online.state_dict())

"pg":{python:`# REINFORCE on a tiny discrete environment. This is the whole algorithm.

import numpy as np
import torch
import torch.nn as nn

class Policy(nn.Module):
    def __init__(self, obs_dim, n_actions, hidden=64):
        super().__init__()
        self.net = nn.Sequential(
            nn.Linear(obs_dim, hidden), nn.ReLU(),
            nn.Linear(hidden, hidden), nn.ReLU(),
            nn.Linear(hidden, n_actions),
        )
    def forward(self, x):
        logits = self.net(x)
        return torch.distributions.Categorical(logits=logits)

policy = Policy(4, 2)
optimizer = torch.optim.Adam(policy.parameters(), lr=1e-3)
gamma = 0.99

for episode in range(1000):
    # collect one episode
    log_probs = []
    rewards = []
    state = env.reset()
    for t in range(500):
        dist = policy(torch.tensor(state, dtype=torch.float32))
        action = dist.sample()
        log_probs.append(dist.log_prob(action))
        state, reward, done, _ = env.step(action.item())
        rewards.append(reward)
        if done:
            break

    # compute return-to-go for each step
    returns = []
    G = 0.0
    for r in reversed(rewards):
        G = r + gamma * G
        returns.append(G)
    returns.reverse()
    returns = torch.tensor(returns, dtype=torch.float32)

    # normalize returns (optional, reduces variance)
    if len(returns) > 1:
        returns = (returns - returns.mean()) / (returns.std() + 1e-8)

    # policy loss: negative because we want to ascend the gradient
    loss = 0.0
    for lp, G in zip(log_probs, returns):
        loss = loss - lp * G

    optimizer.zero_grad()
    loss.backward()
    optimizer.step()

    if episode % 50 == 0:
        print(f"episode {episode}: total reward = {sum(rewards):.1f}")

function openLesson(id){if(!byId[id])return;setTab('lesson');state.current=id;renderLesson(id);window.scrollTo(0,0)}
function downloadText(name,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
function exportProgress(){downloadText('az-rl-studio-progress.json',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts},null,2),'application/json');toast('Progress exported')}
function importProgressFile(file){
 if(file.size>2_000_000){toast('Import rejected: file too large');return}
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||d.schemaVersion!==1||!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||typeof d.drafts!=='object')throw Error('bad schema');

function demoMdp(){
 const gw=GridWorld.make({stepReward:1, goalReward:10, cliffReward:100, slip:0, gamma:0.95});
 const states=GridWorld.states(gw);
 return {
  encoded:`A default 5x5 gridworld MDP:\n  states S = ${states.length} (25 cells, minus 1 wall if you add one)\n  actions A = 4 (up, right, down, left)\n  start     = (0, 0) top-left\n  goal      = (${gw.goal.r}, ${gw.goal.c}) bottom-right\n  step cost = -${gw.stepReward}\n  goal reward = +${gw.goalReward}\n  discount γ = ${gw.gamma}\n\nAn episode ends only when the agent reaches the goal.`,
  decoded:`The MDP has all five parts: states, actions, transitions, rewards, and a discount factor.\n\nThe policy is a rule that says what to do in each state. In the Gridworld Lab you can watch different algorithms find the best policy.\n\nMarkov property: the next cell and reward depend only on where you are and what you do, not on how you got there.`
 };
}

function demoReturns(){
 const rewards=[10,10,10,10,10,10,10,10];
 const rows=[];
 for(const gamma of [0,0.5,0.9,0.99,1.0]){
  let G=0, discount=1;
  for(const r of rewards){G+=discount*r;discount*=gamma}
  const bound=gamma<1?10/(1-gamma):Infinity;
  rows.push(`γ = ${gamma.toString().padEnd(4)}  G = ${G.toFixed(4).padStart(10)}  bound = ${Number.isFinite(bound)?bound.toFixed(2):'∞'}`);
 }
 return {
  encoded:`rewards stream: ${rewards.join(', ')}\n\n${rows.join('\n')}\n\nFor γ<1 and bounded rewards, the geometric series is finite. For γ=1 in a continuing task, the sum grows without bound.`,
  decoded:`The return is the total discounted reward from a point onward. The recursive form G_t = R_{t+1} + γ G_{t+1} is what makes the Bellman equation possible: the value of now depends on the value of next.\n\nγ close to 1 means the agent is patient and considers the far future. γ close to 0 means it is short-sighted and only cares about the next reward.`
 };
}

function demoValues(){
 const Q=[3,5,1,4];
 const uniform=Q.reduce((a,b)=>a+b,0)/Q.length;
 const greedy=Math.max(...Q);
 const twoStep=[2,4,6,8];
 const uniform2=twoStep.reduce((a,b)=>a+b,0)/twoStep.length;
 return {
  encoded:`Q-values at state s: [${Q.join(', ')}]\n\nV^π(s) under a uniform policy over 4 actions:\n  V = (3+5+1+4)/4 = ${uniform.toFixed(3)}\n\nV*(s) (greedy):\n  V* = max(3,5,1,4) = ${greedy}\n\nQ-values at another state: [${twoStep.join(', ')}]\nV^π under uniform: ${uniform2.toFixed(3)}`,
  decoded:`V is the average of Q over the actions the policy might take. The greedy policy always picks the largest Q, so under the greedy policy V equals the max Q.\n\nThe relationship runs both ways:\n  V(s) = Σ_a π(a|s) Q(s,a)\n  Q(s,a) = Σ_{s',r} p(s',r|s,a) [r + γ V(s')]\n\nSubstituting one into the other gives the Bellman equation.`
 };
}

function demoBellman(){
 // one Bellman backup on a tiny 3-state line
 const gamma=0.9;
 // state A -> state B with reward +1
 // state B -> terminal with reward +10
 // state B is a single transition, so Q(B) = 10
 const V_terminal=0;
 const V_B=10+gamma*V_terminal;
 const V_A=1+gamma*V_B;
 return {
  encoded:`Tiny 3-state MDP: A → B → terminal\n  reward A→B = +1\n  reward B→terminal = +10\n  γ = ${gamma}\n\nBellman backup:\n  V(terminal) = 0\n  V(B) = 10 + ${gamma}·0 = ${V_B.toFixed(2)}\n  V(A) = 1 + ${gamma}·${V_B.toFixed(2)} = ${V_A.toFixed(2)}\n\nThe same equation, applied backward from the terminal, gives every value.`,
  decoded:`This is the Bellman equation in its simplest form. The value of a state equals the immediate reward plus the discounted value of the next state.\n\nIn a stochastic environment, replace each deterministic transition with an expectation over (s', r). In an optimization problem, replace the fixed action with a max over actions.\n\nIterating this backup on every state until the values stop changing is value iteration.`
 };
}

function demoDp(){
 const gw=GridWorld.make({stepReward:1, goalReward:10, cliffReward:100, slip:0, gamma:0.9});
 const vi=GridWorld.valueIteration(gw,{theta:1e-8,maxIter:500});
 const pi=GridWorld.policyIteration(gw,{theta:1e-8,maxOuter:50});
 // compare the two
 let maxDiff=0;
 for(let i=0;i<vi.V.length;i++)maxDiff=Math.max(maxDiff,Math.abs(vi.V[i]-pi.V[i]));
 const line=(label,V)=>{
  let s=label+':\n';
  for(let r=0;r<gw.rows;r++){
   s+='  ';
   for(let c=0;c<gw.cols;c++){
    const v=V[GridWorld.idx(gw,r,c)];
    s+=(v===0&&GridWorld.isGoal(gw,r,c)?'  GOAL':(v.toFixed(2).padStart(6)))+' ';
   }
   s+='\n';
  }
  return s;
 };
 return {
  encoded:`Gridworld 5x5, no walls, goal at (4,4)\nγ = 0.9, step cost = -1, goal reward = +10\n\nValue iteration (${vi.iters} sweeps):\n${line('V*',vi.V)}\nPolicy iteration (${pi.outer} outer steps):\n${line('V*',pi.V)}\nMaximum difference between the two: ${maxDiff.toExponential(2)}`,
  decoded:`Both algorithms converge to the same V* because they are solving the same Bellman optimality equation. Value iteration combines evaluation and improvement into one sweep. Policy iteration runs full evaluation between improvements, which usually takes fewer outer steps but each step is more expensive.\n\nThe value of the goal cell is 0 by definition. Every other cell is the expected discounted sum of future rewards.\n\nBecause step rewards are negative, the values are negative and grow closer to zero near the goal.`
 };
}

function demoMcTd(){
 // a 5-state line MDP solved by MC and TD(0)
 const N=5, TERMINAL=N-1, GAMMA=0.9;
 const rng=mulberry32(7);
 function randInt(n){return Math.floor(rng()*n)}
 function stepLine(s,a){const ns=Math.max(0,Math.min(N-1,s+(a===1?1:-1)));const reward=(ns===TERMINAL&&s!==TERMINAL)?1:0;return {ns,reward,done:ns===TERMINAL}}
 const V_mc=new Float64Array(N), V_td=new Float64Array(N);
 const alpha=0.1, episodes=3000;
 for(let e=0;e<episodes;e++){
  // MC
  let s=0;const traj=[];
  for(let t=0;t<50;t++){const a=randInt(2);const {ns,reward,done}=stepLine(s,a);traj.push([s,reward]);s=ns;if(done)break}
  let G=0;
  for(let i=traj.length-1;i>=0;i--){G=traj[i][1]+GAMMA*G;V_mc[traj[i][0]]+=alpha*(G-V_mc[traj[i][0]])}
  // TD
  s=0;
  for(let t=0;t<50;t++){const a=randInt(2);const {ns,reward,done}=stepLine(s,a);const target=reward+GAMMA*(done?0:V_td[ns]);V_td[s]+=alpha*(target-V_td[s]);s=ns;if(done)break}
 }
 return {
  encoded:`5-state line MDP. Terminal on the right (state ${TERMINAL}).\nγ = 0.9, α = 0.1, ${episodes} episodes.\n\nMC (every-visit):\n  ${Array.from(V_mc).map(v=>v.toFixed(3)).join('  ')}\n\nTD(0):\n  ${Array.from(V_td).map(v=>v.toFixed(3)).join('  ')}\n\nBoth should be close to the true values: [0.729, 0.81, 0.9, 1.0, 0]`,
  decoded:`MC and TD(0) both estimate V, but they use different targets. MC uses the actual return from each state. TD(0) uses the reward plus the next state's estimate.\n\nMC is unbiased but has high variance because the full return includes many random rewards. TD(0) is biased because it bootstraps from V, but has lower variance because it only uses one random reward.\n\nIn long episodes, TD usually learns faster. In short episodes the difference is smaller.`
 };
}

function demoSarsaQ(){
 // run SARSA and Q-learning on a small gridworld and compare the learned policy
 const gw=GridWorld.make({stepReward:1, goalReward:10, cliffReward:100, slip:0, gamma:0.95});
 const rng=mulberry32(42);
 const Q_sarsa=GridWorld.emptyQ(gw);
 const Q_q=GridWorld.emptyQ(gw);
 const episodes=3000;
 const alpha=0.1, epsilon=0.1;
 const sarsaRewards=[], qRewards=[];
 for(let e=0;e<episodes;e++){
  const r1=GridWorld.runEpisode(gw,Q_sarsa,'sarsa',{rng,epsilon,alpha,maxSteps:200});
  const r2=GridWorld.runEpisode(gw,Q_q,'qlearning',{rng,epsilon,alpha,maxSteps:200});
  if(e%200===0){sarsaRewards.push(r1.reward);qRewards.push(r2.reward)}
 }
 const sarsaEval=GridWorld.greedyEval(gw,Q_sarsa);
 const qEval=GridWorld.greedyEval(gw,Q_q);
 const line=(label,Q)=>{
  let s=label+'\n';
  for(let r=0;r<gw.rows;r++){
   s+='  ';
   for(let c=0;c<gw.cols;c++){
    if(GridWorld.isWall(gw,r,c)){s+='  #  ';continue}
    if(GridWorld.isGoal(gw,r,c)){s+='  G  ';continue}
    const a=GridWorld.greedy(Q,gw,r,c);
    s+=GridWorld.ARROW[a]+'    ';
   }
   s+='\n';
  }
  return s;
 };
 return {
  encoded:`Gridworld 5x5, γ=${gw.gamma}, α=${alpha}, ε=${epsilon}, ${episodes} episodes each\n\nSARSA greedy policy (greedy return = ${sarsaEval.reward.toFixed(2)}):\n${line('',Q_sarsa)}\nQ-learning greedy policy (greedy return = ${qEval.reward.toFixed(2)}):\n${line('',Q_q)}\n\nNote: SARSA and Q-learning both learn a policy that reaches the goal. The paths may differ slightly because SARSA accounts for the exploring policy it followed.`,
  decoded:`Q-learning updates toward the best next action. SARSA updates toward the action actually taken. Both use ε-greedy to choose actions during training.\n\nIn this gridworld the two algorithms usually produce similar greedy policies because there is no cliff. On a cliff-walking variant, Q-learning would learn the shortest path along the cliff edge, while SARSA would learn a safer path because it accounts for the chance of a slip pushing the agent off the edge.\n\nThe greedy return here is the reward collected by following the greedy policy with no exploration and no slip.`
 };
}

function demoExplore(){
 // compare strategies on a simple 5-arm bandit
 const trueMeans=[0.3,0.1,0.5,0.4,0.2];
 const rng=mulberry32(7);
 function run(strategy,steps){
  const mean=new Float64Array(5), count=new Float64Array(5);
  let total=0;
  for(let t=0;t<steps;t++){
   let a;
   if(strategy==='eps'){a=rng()<0.1?Math.floor(rng()*5):argmax(mean)}
   else if(strategy==='opt'){a=argmaxCount(count,mean,rng)}
   else {a=argmax(mean)}
   const r=trueMeans[a]+(rng()*2-1)*0.1;
   total+=r;count[a]++;mean[a]+=(r-mean[a])/count[a];
  }
  return total/steps;
 }
 function argmax(arr){let bi=0;for(let i=1;i<arr.length;i++)if(arr[i]>arr[bi])bi=i;return bi}
 function argmaxCount(count,mean,rng){
  for(let i=0;i<5;i++)if(count[i]===0)return i;
  let bi=0,bv=-Infinity;
  for(let i=0;i<5;i++){
   const v=mean[i]+Math.sqrt(Math.log(1+rng()*1e6)/count[i]);
   if(v>bv){bv=v;bi=i}
  }
  return bi;
 }
 const steps=2000;
 const eps=run('eps',steps);
 const opt=run('opt',steps);
 const greedy=run('greedy',steps);
 return {
  encoded:`5-armed bandit, true means: [${trueMeans.join(', ')}]\nBest arm mean: ${Math.max(...trueMeans)}\n${steps} steps per strategy\n\nGreedy (always exploit): mean reward ${greedy.toFixed(3)}\nε-greedy (ε=0.1):       mean reward ${eps.toFixed(3)}\nOptimistic init + UCB:  mean reward ${opt.toFixed(3)}\n\nIf exploration is removed entirely, the agent can lock onto a bad arm early.`,
  decoded:`Greedy exploitation without any exploration can get stuck: if the first few pulls of an arm happen to be lucky, the agent will commit to it and never try the better arm.\n\nε-greedy explores uniformly at random. UCB is smarter: it adds an uncertainty bonus that is large for rarely tried arms.\n\nThe exploration-exploitation tradeoff is the central tension of RL. Too little exploration and you miss better options. Too much and you never act on what you have learned.`
 };
}

   GRIDWORLD LAB
   ========================================================================== */
const GW = {
 gw:null,
 algo:'vi',          // 'pe','pi','vi','sarsa','qlearning'
 Q:null,
 V:null,
 policy:null,
 running:false,
 stepCount:0,
 episodeRewards:[],
 lineCurve:[],
 rng:null,
 seed:7,
 epsilon:0.1,
 alpha:0.1,
 speed:1,
 lastAlgoInfo:'',
 editMode:'wall',   // 'wall','cliff','empty'
 init(){
  this.gw=GridWorld.make({stepReward:1,goalReward:10,cliffReward:100,slip:0,gamma:0.95});
  // default: a wall in the middle
  this.gw.walls.add('1,1');
  this.gw.walls.add('2,1');
  this.rng=mulberry32(this.seed);
  this.reset();
 },
 reset(){
  this.rng=mulberry32(this.seed);
  this.stepCount=0;
  this.episodeRewards=[];
  this.lineCurve=[];
  this.Q=GridWorld.emptyQ(this.gw);
  this.V=new Float64Array(this.gw.rows*this.gw.cols);
  this.policy=null;
  this.running=false;
  this.lastAlgoInfo='';
  this.draw();
  this.updateStats();
 },
 clearGrid(){
  this.gw.walls.clear();
  this.gw.cliff.clear();
  this.reset();
 },
 setDefaultGrid(){
  this.gw.walls.clear();
  this.gw.cliff.clear();
  this.gw.walls.add('1,1');
  this.gw.walls.add('2,1');
  this.reset();
 },
 stepOnce(){
  if(this.algo==='pe'||this.algo==='pi'||this.algo==='vi'){
   this.runOneSweep();
  } else {
   this.runOneEpisode();
  }
  this.draw();
  this.updateStats();
 },
 runOneSweep(){
  const gw=this.gw;
  if(this.algo==='vi'){
   const res=GridWorld.valueIteration(gw,{theta:1e-6,maxIter:1});
   this.V=res.V;this.policy=res.policy;
   this.stepCount++;
   this.lastAlgoInfo=`VI sweep ${this.stepCount}`;
  } else if(this.algo==='pe'){
   if(!this.policy){
    this.policy={};
    for(const [r,c] of GridWorld.states(gw)){
     if(GridWorld.isTerminal(gw,r,c)){this.policy[r*gw.cols+c]=[0,0,0,0];continue}
     this.policy[r*gw.cols+c]=[0.25,0.25,0.25,0.25];
    }
   }
   const res=GridWorld.policyEvaluation(gw,this.policy,{theta:1e-6,maxIter:1});
   this.V=res.V;
   this.stepCount++;
   this.lastAlgoInfo=`PE sweep ${this.stepCount}`;
  } else if(this.algo==='pi'){
   const res=GridWorld.policyIteration(gw,{theta:1e-8,maxOuter:1});
   this.V=res.V;this.policy=res.policy;
   this.stepCount++;
   this.lastAlgoInfo=`PI outer step ${this.stepCount}`;
  }
 },
 runOneEpisode(){
  const gw=this.gw;
  const algo=this.algo;
  const rng=this.rng;
  const res=GridWorld.runEpisode(gw,this.Q,algo,{rng,epsilon:this.epsilon,alpha:this.alpha,maxSteps:200});
  this.stepCount++;
  this.episodeRewards.push(res.reward);
  if(this.stepCount%20===0){
   // record a running average for the curve
   const recent=this.episodeRewards.slice(-50);
   const avg=recent.reduce((a,b)=>a+b,0)/recent.length;
   this.lineCurve.push(avg);
   if(this.lineCurve.length>200)this.lineCurve.shift();
  }
  // recompute V from Q for display
  for(let r=0;r<gw.rows;r++)for(let c=0;c<gw.cols;c++){
   if(GridWorld.isWall(gw,r,c))continue;
   const q=this.Q[r*gw.cols+c];
   let mx=-Infinity;for(const v of q)if(v>mx)mx=v;
   this.V[GridWorld.idx(gw,r,c)]=mx;
  }
  this.policy=null;
  this.lastAlgoInfo=`${algo.toUpperCase()} episode ${this.stepCount}`;
 },
 runMany(n){
  for(let i=0;i<n;i++){
   if(this.algo==='pe'||this.algo==='pi'||this.algo==='vi')this.runOneSweep();
   else this.runOneEpisode();
  }
  this.draw();
  this.updateStats();
 },
 setAlgo(a){
  this.algo=a;
  this.reset();
 },
 draw(){
  const cv=$('#gwCanvas');
  if(!cv)return;
  const gw=this.gw;
  const W=cv.width, H=cv.height;
  const ctx=cv.getContext('2d');
  const cellW=W/gw.cols, cellH=H/gw.rows;
  // background
  ctx.clearRect(0,0,W,H);
  // color scale for V
  let vMin=0, vMax=0;
  for(let i=0;i<this.V.length;i++){
   const v=this.V[i];
   if(v<vMin)vMin=v;
   if(v>vMax)vMax=v;
  }
  if(vMax-vMin<1e-6){vMin=-1;vMax=1}
  for(let r=0;r<gw.rows;r++){
   for(let c=0;c<gw.cols;c++){
    const x=c*cellW, y=r*cellH;
    if(GridWorld.isWall(gw,r,c)){
     ctx.fillStyle='#1a1a1a';
     ctx.fillRect(x,y,cellW,cellH);
     ctx.strokeStyle='#000';ctx.strokeRect(x+0.5,y+0.5,cellW-1,cellH-1);
     ctx.fillStyle='#888';ctx.font='bold 18px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
     ctx.fillText('#',x+cellW/2,y+cellH/2);
     continue;
    }
    if(GridWorld.isGoal(gw,r,c)){
     ctx.fillStyle='#3a7d44';ctx.fillRect(x,y,cellW,cellH);
    } else if(GridWorld.isCliff(gw,r,c)){
     ctx.fillStyle='#7d3a3a';ctx.fillRect(x,y,cellW,cellH);
    } else {
     const v=this.V[GridWorld.idx(gw,r,c)];
     const t=(v-vMin)/Math.max(1e-9,vMax-vMin);
     const rC=Math.round(220*(1-t)+220*t*0.4);
     const gC=Math.round(200*(1-t)+150*t*0.6);
     const bC=Math.round(170*(1-t)+60*t*0.4);
     ctx.fillStyle=`rgb(${rC},${gC},${bC})`;
     ctx.fillRect(x,y,cellW,cellH);
    }
    ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.strokeRect(x+0.5,y+0.5,cellW-1,cellH-1);
    // value text
    if(!GridWorld.isGoal(gw,r,c)){
     const v=this.V[GridWorld.idx(gw,r,c)];
     if(Math.abs(v)>1e-6){
      ctx.fillStyle='rgba(0,0,0,0.75)';
      ctx.font='11px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(v.toFixed(1),x+cellW/2,y+cellH/2+6);
     }
    }
    // policy arrow
    if(this.policy){
     const p=this.policy[r*gw.cols+c];
     if(p){
      let best=0;
      for(let i=1;i<4;i++)if(p[i]>p[best])best=i;
      ctx.fillStyle='#1a1005';
      ctx.font='bold 22px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(GridWorld.ARROW[best],x+cellW/2,y+cellH/2);
     }
    } else if(this.algo==='sarsa'||this.algo==='qlearning'){
     const q=this.Q[r*gw.cols+c];
     if(q){
      let best=0;
      for(let i=1;i<4;i++)if(q[i]>q[best])best=i;
      ctx.fillStyle='rgba(26,16,5,0.75)';
      ctx.font='bold 22px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(GridWorld.ARROW[best],x+cellW/2,y+cellH/2);
     }
    }
    // start marker
    if(r===gw.start.r&&c===gw.start.c){
     ctx.strokeStyle='#c97a12';ctx.lineWidth=2.5;
     ctx.strokeRect(x+3,y+3,cellW-6,cellH-6);
    }
   }
  }
  // Draw learning curve
  const curve=$('#gwCurve');
  if(curve){
   const cctx=curve.getContext('2d');
   const CW=curve.width, CH=curve.height;
   cctx.clearRect(0,0,CW,CH);
   cctx.fillStyle='#faf7f1';cctx.fillRect(0,0,CW,CH);
   cctx.strokeStyle='rgba(0,0,0,0.15)';cctx.strokeRect(0.5,0.5,CW-1,CH-1);
   if(this.lineCurve.length>1){
    let lo=Infinity,hi=-Infinity;
    for(const v of this.lineCurve){if(v<lo)lo=v;if(v>hi)hi=v}
    const pad=(hi-lo)*0.1||1;
    lo-=pad;hi+=pad;
    cctx.strokeStyle='#a35a06';cctx.lineWidth=1.6;
    cctx.beginPath();
    for(let i=0;i<this.lineCurve.length;i++){
     const x=2+(i/(this.lineCurve.length-1))*(CW-4);
     const y=CH-2-((this.lineCurve[i]-lo)/(hi-lo))*(CH-4);
     i?cctx.lineTo(x,y):cctx.moveTo(x,y);
    }
    cctx.stroke();
   } else {
    cctx.fillStyle='#8b8171';cctx.font='11px monospace';cctx.textAlign='center';cctx.textBaseline='middle';
    cctx.fillText('learning curve (per-episode return, averaged over 50 episodes)',CW/2,CH/2);
   }
  }
 },
 updateStats(){
  const s=$('#gwSteps');if(s)s.textContent=String(this.stepCount);
  const a=$('#gwAlgo');if(a)a.textContent=this.lastAlgoInfo||'—';
  let lastReward=0;
  if(this.episodeRewards.length){
   const last10=this.episodeRewards.slice(-10);
   lastReward=last10.reduce((a,b)=>a+b,0)/last10.length;
  }
  const r=$('#gwReward');if(r)r.textContent=this.algo.startsWith('q')||this.algo==='sarsa'?lastReward.toFixed(1):'—';
 },
 handleClick(ev){
  const cv=$('#gwCanvas');
  if(!cv)return;
  const rect=cv.getBoundingClientRect();
  const scaleX=cv.width/rect.width;
  const scaleY=cv.height/rect.height;
  const px=(ev.clientX-rect.left)*scaleX;
  const py=(ev.clientY-rect.top)*scaleY;
  const c=Math.floor(px/(cv.width/this.gw.cols));
  const r=Math.floor(py/(cv.height/this.gw.rows));
  if(!GridWorld.inBounds(this.gw,r,c))return;
  if(r===this.gw.goal.r&&c===this.gw.goal.c)return;
  if(r===this.gw.start.r&&c===this.gw.start.c)return;
  const key=r+','+c;
  if(this.editMode==='wall'){
   if(this.gw.cliff.has(key))this.gw.cliff.delete(key);
   else if(this.gw.walls.has(key))this.gw.walls.delete(key);
   else this.gw.walls.add(key);
  } else if(this.editMode==='cliff'){
   if(this.gw.walls.has(key))this.gw.walls.delete(key);
   else if(this.gw.cliff.has(key))this.gw.cliff.delete(key);
   else this.gw.cliff.add(key);
  } else {
   this.gw.walls.delete(key);this.gw.cliff.delete(key);
  }
  this.reset();
 }
};

/* Simple CartPole-ish simulation. Uses a linearized pole model. */
const CartPoleLab={
 state:null,
 best:0,
 runs:0,
 running:false,
 raf:0,
 init(){
  this.reset();
 },
 reset(){
  this.state={
   x:0, vx:0, theta:0.05, vtheta:0,
   steps:0, done:false
  };
  this.running=false;
  cancelAnimationFrame(this.raf);
 },
 physics(action){
  const s=this.state;
  const g=9.8, mp=0.1, mc=1.0, l=0.5;
  const force=action===0?-10:10;
  const total=mc+mp;
  const cos=Math.cos(s.theta), sin=Math.sin(s.theta);
  const temp=(force+mp*l*s.vtheta*s.vtheta*sin)/total;
  const thetaAcc=(g*sin - cos*temp)/(l*(4/3 - mp*cos*cos/total));
  const xAcc=temp - mp*l*thetaAcc*cos/total;
  s.x+=s.vx*0.02;
  s.vx+=xAcc*0.02;
  s.theta+=s.vtheta*0.02;
  s.vtheta+=thetaAcc*0.02;
  s.steps++;
  if(Math.abs(s.x)>2.4 || Math.abs(s.theta)>0.2095 || s.steps>=500){
   s.done=true;
  }
 },
 startEpisode(){
  if(this.running)return;
  this.reset();
  this.running=true;
  const loop=()=>{
   if(!this.running)return;
   if(this.state.done){
    this.runs++;
    if(this.state.steps>this.best)this.best=this.state.steps;
    this.running=false;
    this.updateStats();
    return;
   }
   // random policy
   const a=Math.random()<0.5?0:1;
   this.physics(a);
   this.draw();
   this.updateStats();
   this.raf=requestAnimationFrame(loop);
  };
  this.raf=requestAnimationFrame(loop);
 },
 stop(){this.running=false;cancelAnimationFrame(this.raf)},
 updateStats(){
  const s=$('#cpSteps');if(s)s.textContent=String(this.state.steps);
  const b=$('#cpBest');if(b)b.textContent=String(this.best);
  const r=$('#cpRuns');if(r)r.textContent=String(this.runs);
 },
 draw(){
  const cv=$('#cpCanvas');
  if(!cv)return;
  const ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height;
  ctx.fillStyle='#faf7f1';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#e2dbcc';ctx.strokeRect(0.5,0.5,W-1,H-1);
  // ground line
  ctx.strokeStyle='#cec5b2';ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(20,H-50);ctx.lineTo(W-20,H-50);
  ctx.stroke();
  // cart position mapped
  const cx=W/2 + (this.state.x/2.4)*(W/2-60);
  const cy=H-65;
  // draw cart
  ctx.fillStyle='#a35a06';
  ctx.fillRect(cx-40,cy-20,80,30);
  // draw pole
  const px=cx;
  const py=cy-20;
  const len=90;
  const ex=px+len*Math.sin(this.state.theta);
  const ey=py-len*Math.cos(this.state.theta);
  ctx.strokeStyle='#2a2620';ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(px,py);ctx.lineTo(ex,ey);
  ctx.stroke();
  // hub
  ctx.fillStyle='#7a3f00';
  ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill();
  // angle text
  ctx.fillStyle='#655c4e';ctx.font='12px monospace';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('theta = '+this.state.theta.toFixed(3)+' rad',20,20);
  ctx.fillText('x = '+this.state.x.toFixed(2),20,38);
  ctx.fillText('steps = '+this.state.steps,20,56);
 }
};

function renderCheatSheet(){
 return `<div class="breadcrumb">RL Studio / Cheat sheet</div>
<header class="header">
 <div class="eyebrow">CHEAT SHEET</div>
 <h1>Every equation, every rule, one screen.</h1>
 <p>Print this tab. Every formula is from the rigor core. No number is invented.</p>
</header>

<section class="panel"><div class="panel-head"><h2>Notation</h2></div><div class="body"><div class="table-wrap"><table>
 <thead><tr><th>Symbol</th><th>Meaning</th></tr></thead>
 <tbody>
  <tr><td class="mono">S_t, A_t, R_{t+1}</td><td>state, action, reward after A_t (Sutton &amp; Barto convention)</td></tr>
  <tr><td class="mono">p(s',r | s,a)</td><td>environment dynamics (the model)</td></tr>
  <tr><td class="mono">π(a | s)</td><td>policy</td></tr>
  <tr><td class="mono">G_t = Σ γ^k R_{t+k+1}</td><td>return; also G_t = R_{t+1} + γ G_{t+1}</td></tr>
  <tr><td class="mono">V^π, Q^π, V*, Q*</td><td>value functions</td></tr>
  <tr><td class="mono">α, γ, ε</td><td>step size, discount, exploration rate</td></tr>
  <tr><td class="mono">δ_t</td><td>temporal-difference error</td></tr>
 </tbody>
</table></div></div></section>

<section class="panel"><div class="panel-head"><h2>Core equations</h2></div><div class="body">
 <pre class="pseudo">Return:
  G_t = Σ_{k=0}^{∞} γ^k R_{t+k+1} = R_{t+1} + γ G_{t+1}

Value functions:
  V^π(s) = E_π[G_t | S_t = s]
  Q^π(s,a) = E_π[G_t | S_t = s, A_t = a]
  V^π(s) = Σ_a π(a|s) Q^π(s,a)

Bellman expectation:
  V^π(s) = Σ_a π(a|s) Σ_{s',r} p(s',r|s,a) [r + γ V^π(s')]
  Q^π(s,a) = Σ_{s',r} p(s',r|s,a) [r + γ Σ_{a'} π(a'|s') Q^π(s',a')]

Bellman optimality:
  V*(s) = max_a Σ_{s',r} p(s',r|s,a) [r + γ V*(s')]
  Q*(s,a) = Σ_{s',r} p(s',r|s,a) [r + γ max_{a'} Q*(s',a')]

TD error (with terminal handling):
  δ_t = R_{t+1} + γ (1 - done) max_{a'} Q(S_{t+1}, a') - Q(S_t, A_t)

Q-learning (off-policy):
  Q(S,A) ← Q(S,A) + α δ_t

SARSA (on-policy):
  Q(S,A) ← Q(S,A) + α [ R_{t+1} + γ (1 - done) Q(S',A') - Q(S,A) ]
  where A' is the action actually taken

Policy gradient (REINFORCE, episodic):
  ∇_θ J = E_π[ Σ_t ∇_θ log π_θ(A_t | S_t) · (G_t - b(S_t)) ]

Baseline unbiasedness:
  E[ ∇_θ log π_θ(a|s) · b(s) ] = b(s) ∇_θ Σ_a π_θ(a|s) = 0

Log-derivative trick:
  ∇_θ π_θ(a|s) = π_θ(a|s) · ∇_θ log π_θ(a|s)</pre>
</div></section>

<section class="panel"><div class="panel-head"><h2>Algorithm classification</h2></div><div class="body"><div class="table-wrap"><table>
 <thead><tr><th>Algorithm</th><th>Model?</th><th>On/Off</th><th>Predict/Control</th><th>Table?</th></tr></thead>
 <tbody>
  <tr><td>Policy evaluation</td><td>model-based</td><td>—</td><td>prediction</td><td>table</td></tr>
  <tr><td>Policy iteration</td><td>model-based</td><td>—</td><td>control</td><td>table</td></tr>
  <tr><td>Value iteration</td><td>model-based</td><td>—</td><td>control</td><td>table</td></tr>
  <tr><td>MC prediction</td><td>model-free</td><td>on</td><td>prediction</td><td>table</td></tr>
  <tr><td>TD(0)</td><td>model-free</td><td>on</td><td>prediction</td><td>table</td></tr>
  <tr><td>SARSA</td><td>model-free</td><td>on</td><td>control</td><td>table</td></tr>
  <tr><td>Q-learning</td><td>model-free</td><td>off</td><td>control</td><td>table</td></tr>
  <tr><td>DQN</td><td>model-free</td><td>off</td><td>control</td><td>network</td></tr>
  <tr><td>REINFORCE</td><td>model-free</td><td>on</td><td>control</td><td>network</td></tr>
 </tbody>
</table></div></div></section>

<section class="panel"><div class="panel-head"><h2>Failure modes</h2></div><div class="body"><div class="table-wrap"><table>
 <thead><tr><th>Symptom</th><th>Cause</th><th>Fix</th></tr></thead>
 <tbody>
  <tr><td>Unstable DQN loss</td><td>Correlated samples</td><td>Replay buffer</td></tr>
  <tr><td>Q-targets oscillate</td><td>Moving target</td><td>Target network</td></tr>
  <tr><td>Inflated Q-values</td><td>Max over same estimate</td><td>Double DQN</td></tr>
  <tr><td>Divergence</td><td>Deadly triad</td><td>Target net, smaller α, replay</td></tr>
  <tr><td>REINFORCE high variance</td><td>No baseline</td><td>Reward-to-go, baseline, normalization</td></tr>
  <tr><td>Never finds reward</td><td>Sparse reward, weak exploration</td><td>Optimistic init, ε schedule, shaping</td></tr>
  <tr><td>Looks learned but fails new seeds</td><td>Single-seed evaluation</td><td>≥5 seeds, report mean ± std</td></tr>
 </tbody>
</table></div></div></section>

<section class="panel"><div class="panel-head"><h2>Exit gate (all six, unaided)</h2></div><div class="body"><ol class="steps">
 <li>Write the Bellman optimality equation for Q* from memory and explain every term.</li>

</div></section>

<footer class="footer"><span>Az RL Studio · cheat sheet</span><span>All computation runs in your browser; nothing is uploaded.</span></footer>`;

function runSelfTest(){
 const out=$('#selfTestOut'),sum=$('#selfTestSummary');
 if(!out)return;
 const lines=[];
 let allPass=true;
 // test 1: VI and PI agree
 const gw1=GridWorld.make({stepReward:1,goalReward:10,cliffReward:100,slip:0,gamma:0.9});
 const vi=GridWorld.valueIteration(gw1,{theta:1e-9,maxIter:2000});
 const pi=GridWorld.policyIteration(gw1,{theta:1e-9,maxOuter:100});
 let maxDiff=0;
 for(let i=0;i<vi.V.length;i++)maxDiff=Math.max(maxDiff,Math.abs(vi.V[i]-pi.V[i]));
 const t1=maxDiff<1e-6;
 if(!t1)allPass=false;
 lines.push(`[${t1?'PASS':'FAIL'}] VI and PI agree to 1e-6  (max diff = ${maxDiff.toExponential(2)})`);
 // test 2: Q-learning approaches the DP-computed Q*
 const gw2=GridWorld.make({stepReward:1,goalReward:10,cliffReward:100,slip:0,gamma:0.9});
 const dpRes=GridWorld.valueIteration(gw2,{theta:1e-9,maxIter:2000});
 const Qstar={};
 for(const [r,c] of GridWorld.states(gw2)){
  Qstar[r*gw2.cols+c]=new Float64Array(4);
  for(const a of GridWorld.ACTIONS){
   const possible=GridWorld.possibleTransitions(gw2,r,c,a);
   let q=0;
   for(const t of possible)q+=t.prob*(t.reward+gw2.gamma*dpRes.V[GridWorld.idx(gw2,t.r,t.c)]);
   Qstar[r*gw2.cols+c][a]=q;
  }
 }
 const rng=mulberry32(1);
 const Q=GridWorld.emptyQ(gw2);
 for(let e=0;e<8000;e++){
  GridWorld.runEpisode(gw2,Q,'qlearning',{rng,epsilon:0.1,alpha:0.1,maxSteps:200});
 }
 let maxQDiff=0;
 for(const key in Qstar){
  for(let a=0;a<4;a++){
   maxQDiff=Math.max(maxQDiff,Math.abs(Q[key][a]-Qstar[key][a]));
  }
 }
 const t2=maxQDiff<1.0;
 if(!t2)allPass=false;
 lines.push(`[${t2?'PASS':'FAIL'}] Q-learning approaches DP Q*  (max diff = ${maxQDiff.toFixed(3)})`);
 // test 3: Bellman equation holds for the DP solution
 let maxResidual=0;
 for(const [r,c] of GridWorld.states(gw2)){
  if(GridWorld.isTerminal(gw2,r,c))continue;
  const v=dpRes.V[GridWorld.idx(gw2,r,c)];
  let best=-Infinity;
  for(const a of GridWorld.ACTIONS){
   const possible=GridWorld.possibleTransitions(gw2,r,c,a);
   let q=0;
   for(const t of possible)q+=t.prob*(t.reward+gw2.gamma*dpRes.V[GridWorld.idx(gw2,t.r,t.c)]);
   if(q>best)best=q;
  }
  maxResidual=Math.max(maxResidual,Math.abs(v-best));
 }
 const t3=maxResidual<1e-6;
 if(!t3)allPass=false;
 lines.push(`[${t3?'PASS':'FAIL'}] Bellman residual at the VI fixed point  (max = ${maxResidual.toExponential(2)})`);
 out.textContent=lines.join('\n');
 if(sum)sum.textContent=(allPass?'all checks passed':'some checks failed');
 if(sum)sum.style.color=allPass?'var(--good)':'var(--bad)';
}

/* ============================================================================
   Tab switching and shell
   ========================================================================== */
function setTab(t){
 state.tab=t;save();
 $$('.tab').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.tab===t)));
 if(t==='lesson'){
  if(state.page==='progress')renderProgressPage();
  else if(state.current&&byId[state.current])renderLesson(state.current);
  else renderHome();
 } else if(t==='gridworld'){
  renderGridworldLab();
 } else if(t==='deeplab'){
  renderDeepLab();
 } else if(t==='cheatsheet'){
  $('#mainView').innerHTML=renderCheatSheet();
  const b=$('#runSelfTest');if(b)b.onclick=runSelfTest;
 }
 renderTree();
}

function bindShell(){
 $('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save()};
 $('#printBtn').onclick=()=>print();
 $('#exportBtn').onclick=exportProgress;
 $('#importBtn').onclick=()=>$('#importFile').click();
 $('#importFile').onchange=e=>{if(e.target.files[0])importProgressFile(e.target.files[0]);e.target.value=''};
 $('#searchInput').oninput=renderTree;
 $('#chapterFilter').onchange=renderTree;
 $('#homeLink').onclick=e=>{e.preventDefault();state.page='home';setTab('lesson');history.replaceState(null,'','#home')};
 $('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)};
 $$('.tab').forEach(t=>t.onclick=()=>setTab(t.dataset.tab));
 document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=()=>{state.page='home';setTab('lesson')});
 document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=()=>{state.page='progress';setTab('lesson')});
 document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}
  if(e.key.toLowerCase()==='t'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
   state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';
   applyTheme();save();
  }
 });
}

function init(){
 load();
 applyTheme();
 CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').append(op)});
 bindShell();
 GW.init();
 renderTree();
 const hash=location.hash.replace(/^#/,'');
 if(state.tab==='gridworld')setTab('gridworld');
 else if(state.tab==='deeplab')setTab('deeplab');
 else if(state.tab==='cheatsheet')setTab('cheatsheet');
 else if(hash&&byId[hash]){state.current=hash;renderLesson(hash);state.tab='lesson'}
 else if(state.current&&byId[state.current]){renderLesson(state.current);state.tab='lesson'}
 else {renderHome();state.tab='lesson'}
 progress();
}
init();
</script></body></html>
